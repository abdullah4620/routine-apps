<style>
:root {
  --primary: #10b981;
  --primary-glow: rgba(16, 185, 129, 0.25);
  --bg-dark: #0f172a;
  --card-bg: #1e293b;
  --card-border: #334155;
  --text-main: #f8fafc;
  --text-sub: #94a3b8;
  --accent: #38bdf8;
  --danger: #ef4444;
  --warning: #f59e0b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body { 
  background: var(--bg-dark); 
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
  color: var(--text-main); 
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 10px 0;
}

.app-container {
  width: 100%;
  max-width: 480px; 
  background: #111827;
  min-height: 95vh;
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  border: 1px solid #1f2937;
  overflow: hidden;
}

.top-header {
  padding: 18px 20px;
  background: rgba(17, 24, 39, 0.8);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid #1f2937;
  position: sticky;
  top: 0;
  z-index: 20;
}

.brand-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.brand-title h1 { 
  font-size: 17px; 
  background: linear-gradient(to right, #10b981, #38bdf8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 800;
}

.role-bar {
  display: flex;
  background: #0f172a;
  padding: 4px;
  border-radius: 12px;
  gap: 4px;
  border: 1px solid #1f2937;
}

.role-btn {
  flex: 1;
  padding: 8px 0;
  background: transparent;
  color: var(--text-sub);
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.3s ease;
  border: none;
  cursor: pointer;
}

.role-btn.active {
  background: var(--primary);
  color: #000;
  box-shadow: 0 0 12px var(--primary-glow);
}

.content {
  padding: 18px;
  flex: 1;
}

.controls {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}

.select-input, .input-field {
  flex: 1;
  border: 1px solid var(--card-border);
  background: var(--card-bg);
  color: var(--text-main);
  border-radius: 12px;
  padding: 11px 14px;
  outline: none;
  font-size: 14px;
  transition: border 0.3s;
}

.select-input:focus, .input-field:focus { 
  border-color: var(--primary); 
}

.day-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  background: linear-gradient(135deg, #1e293b, #0f172a);
  padding: 12px 16px;
  border-radius: 12px;
  border: 1px solid var(--card-border);
}

.day-title {
  color: var(--primary);
  font-weight: 700;
  font-size: 16px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.routine-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-left: 4px solid var(--primary);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 14px;
  position: relative;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  transition: transform 0.2s;
}

.routine-card:hover {
  transform: translateY(-2px);
}

.card-title {
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 6px;
  padding-right: 50px;
}

.card-teacher {
  font-size: 14px;
  color: var(--accent);
  margin-bottom: 10px;
  font-weight: 500;
}

.card-info {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 13px;
  color: var(--text-sub);
}

.card-badge {
  position: absolute;
  top: 14px;
  right: 14px;
  background: rgba(16, 185, 129, 0.15);
  color: var(--primary);
  border: 1px solid var(--primary);
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
}

.card-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid rgba(255,255,255,0.05);
}

.btn-sm {
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  border: none;
  cursor: pointer;
}

.btn-edit { background: var(--warning); color: #000; }
.btn-delete { background: var(--danger); color: #fff; }

.admin-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: var(--card-bg);
  padding: 18px;
  border-radius: 14px;
  border: 1px solid var(--card-border);
  margin-bottom: 20px;
}

.btn-primary {
  background: var(--primary);
  color: #000;
  padding: 12px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 15px;
  border: none;
  cursor: pointer;
  box-shadow: 0 4px 12px var(--primary-glow);
}

.empty-msg {
  text-align: center;
  padding: 50px 10px;
  color: var(--text-sub);
  font-size: 14px;
}
</style>

<div class="app-container">
  <header class="top-header">
    <div class="brand-title">
      <h1>🏫 সিলেট সরকারি আলিয়া মাদ্রাসা</h1>
      <small id="roleIndicator" style="color: var(--text-sub); font-size: 11px;">Student Mode</small>
    </div>
    <div class="role-bar">
      <button class="role-btn active" onclick="setRole('student')">🎓 ছাত্র/ছাত্রী</button>
      <button class="role-btn" onclick="setRole('teacher')">👨‍🏫 শিক্ষক</button>
      <button class="role-btn" onclick="setRole('admin')">⚙️ এডিট</button>
    </div>
  </header>

  <div class="content">
    <div class="controls" id="filterControls">
      <select id="mainSelect" class="select-input" onchange="renderCards()"></select>
      <select id="daySelect" class="select-input" onchange="renderCards()"></select>
    </div>

    <div class="day-header">
      <span class="day-title" id="dayDisplay">📅 রবিবার</span>
      <span style="color: var(--text-sub); font-size: 12px;">দৈনিক ক্লাস রুটিন</span>
    </div>

    <div id="cardContainer"></div>

    <div id="adminPanel" style="display: none;">
      <h3 id="formTitle" style="margin-bottom: 12px; font-size: 15px; color: var(--primary);">ক্লাস সংশোধন / যুক্ত করুন</h3>
      <div class="admin-form">
        <input type="hidden" id="editId">
        <input class="input-field" id="addSubject" placeholder="বিষয়">
        <input class="input-field" id="addTeacher" placeholder="শিক্ষক (যেমন: ZHC, MRM)">
        <input class="input-field" id="addRoom" placeholder="রুম নম্বর (যেমন: কক্ষ-০৬)">
        <select id="addPeriod" class="select-input">
          <option value="1">১ম পিরিয়ড (9:45 AM - 10:30 AM)</option>
          <option value="2">২য় পিরিয়ড (10:30 AM - 11:15 AM)</option>
          <option value="3">৩য় পিরিয়ড (11:15 AM - 12:00 PM)</option>
          <option value="4">৪র্থ পিরিয়ড (12:00 PM - 12:45 PM)</option>
          <option value="5">৫ম পিরিয়ড (12:45 PM - 1:25 PM)</option>
          <option value="6">৬ষ্ঠ পিরিয়ড (2:00 PM - 2:45 PM)</option>
          <option value="7">৭ম পিরিয়ড (2:45 PM - 3:30 PM)</option>
        </select>
        <select id="addDay" class="select-input"></select>
        <select id="addClass" class="select-input"></select>
        <input class="input-field" id="addTag" placeholder="ট্যাগ (যেমন: বিজ্ঞান / সাধারণ)">
        <button class="btn-primary" id="saveBtn" onclick="saveRoutine()">রুটিন সংরক্ষণ করুন</button>
      </div>
    </div>
  </div>
</div>

  {id:532, day:"বৃহস্পতিবার", className:"দাখিল-১০ম", period:5, subject:"উ.গণিত", teacher:"RH", room:"কক্ষ-০৭", tag:""},
  {id:533, day:"বৃহস্পতিবার", className:"দাখিল-১০ম", period:6, subject:"কুরআন", teacher:"SMS", room:"কক্ষ-০৬", tag:""},
  {id:534, day:"বৃহস্পতিবার", className:"দাখিল-১০ম", period:7, subject:"রসায়ন / তথ্য.যো.প্র", teacher:"HRC / RS", room:"কক্ষ-০৯ / ০৬", tag:""},
  {id:535, day:"বৃহস্পতিবার", className:"দাখিল-৯ম", period:1, subject:"ইংরেজি", teacher:"MRC", room:"কক্ষ-০৫", tag:""},
  {id:536, day:"বৃহস্পতিবার", className:"দাখিল-৯ম", period:2, subject:"আরবি-২", teacher:"MRM", room:"কক্ষ-০৫", tag:""},
  {id:537, day:"বৃহস্পতিবার", className:"দাখিল-৯ম", period:3, subject:"গণিত", teacher:"AH", room:"কক্ষ-০৫", tag:""},
  {id:538, day:"বৃহস্পতিবার", className:"দাখিল-৯ম", period:4, subject:"পদার্থ / ই.ইতি", teacher:"RS / AH", room:"কক্ষ-০৮ / ০৫", tag:""},
  {id:539, day:"বৃহস্পতিবার", className:"দাখিল-৯ম", period:5, subject:"উ.গণিত", teacher:"AH", room:"কক্ষ-০৭", tag:""},
  {id:540, day:"বৃহস্পতিবার", className:"দাখিল-৯ম", period:6, subject:"আকাইদ ও ফিকহ", teacher:"SMS", room:"কক্ষ-০৫", tag:""}
];

let rows = JSON.parse(localStorage.getItem("sylhet_alia_full_v4") || JSON.stringify(fullRoutineData));
let currentRole = "student";

function init() {
  setTodayDay();
  populateDropdowns();
  setRole('student');
}

function setTodayDay() {
  const dayNames = ["রবিবার", "সোমবার", "মঙ্গলবার", "বুধবার", "বৃহস্পতিবার", "শুক্রবার", "শনিবার"];
  const todayIndex = new Date().getDay();
  const today = (todayIndex >= 0 && todayIndex <= 4) ? dayNames[todayIndex] : "রবিবার";
  
  daySelect.innerHTML = days.map(d => `<option value="${d}" ${d === today ? 'selected':''}>${d}</option>`).join("");
  addDay.innerHTML = days.map(d => `<option value="${d}">${d}</option>`).join("");
}

function populateDropdowns() {
  addClass.innerHTML = classes.map(c => `<option value="${c}">${c}</option>`).join("");
}

function setRole(role) {
  currentRole = role;
  
  document.querySelectorAll(".role-btn").forEach((btn, idx) => {
    btn.classList.toggle("active", (role === 'student' && idx === 0) || (role === 'teacher' && idx === 1) || (role === 'admin' && idx === 2));
  });

  const mainSelect = document.getElementById("mainSelect");
  resetForm();

  if (role === "student") {
    roleIndicator.innerText = "Student Mode";
    adminPanel.style.display = "none";
    filterControls.style.display = "flex";
    mainSelect.innerHTML = classes.map(c => `<option value="${c}">${c}</option>`).join("");
  } else if (role === "teacher") {
    roleIndicator.innerText = "Teacher Mode";
    adminPanel.style.display = "none";
    filterControls.style.display = "flex";
    
    // Extract unique teacher codes
    let allTeachers = [];
    rows.forEach(r => {
      let tList = r.teacher.split('/').map(t => t.trim());
      allTeachers.push(...tList);
    });
    const teachers = [...new Set(allTeachers)].filter(Boolean);

    mainSelect.innerHTML = teachers.length > 0 
      ? teachers.map(t => `<option value="${t}">${t}</option>`).join("") 
      : `<option value="">কোন শিক্ষক পাওয়া যায়নি</option>`;
  } else if (role === "admin") {
    roleIndicator.innerText = "Admin & Edit Panel";
    adminPanel.style.display = "block";
    filterControls.style.display = "flex";
    mainSelect.innerHTML = classes.map(c => `<option value="${c}">${c}</option>`).join("");
  }

  renderCards();
}

function renderCards() {
  const selectedVal = mainSelect.value;
  const selectedDay = daySelect.value;
  dayDisplay.innerHTML = `📅 ${selectedDay}`;

  let filtered = [];

  if (currentRole === "teacher") {
    filtered = rows.filter(r => r.teacher.includes(selectedVal) && r.day === selectedDay);
  } else {
    filtered = rows.filter(r => r.className === selectedVal && r.day === selectedDay);
  }

  filtered.sort((a,b) => a.period - b.period);

  if (filtered.length === 0) {
    cardContainer.innerHTML = `<div class="empty-msg">এই দিনে নির্দিষ্ট শ্রেণির কোনো ক্লাস বরাদ্দ নেই।</div>`;
    return;
  }

  cardContainer.innerHTML = filtered.map(r => `
    <div class="routine-card">
      ${r.tag ? `<div class="card-badge">${r.tag}</div>` : ''}
      <div class="card-title">${r.subject}</div>
      <div class="card-teacher">👨‍🏫 শিক্ষক: ${r.teacher} ${currentRole === 'teacher' ? `(${r.className})` : ''}</div>
      <div class="card-info">
        <div>🕒 সময়: ${times[r.period] || 'সময় নির্ধারিত নয়'} (পিরিয়ড: ${r.period})</div>
        <div>📍 স্থান: ${r.room}</div>
      </div>
      ${currentRole === 'admin' ? `
        <div class="card-actions">
          <button class="btn-sm btn-edit" onclick="editRoutine(${r.id})">✏️ এডিট</button>
          <button class="btn-sm btn-delete" onclick="deleteRoutine(${r.id})">🗑️ ডিলিট</button>
        </div>
      ` : ''}
    </div>
  `).join("");
}

function saveRoutine() {
  const editIdVal = editId.value;
  
  if (!addSubject.value || !addTeacher.value || !addRoom.value) {
    alert("অনুগ্রহ করে বিষয়, শিক্ষক এবং রুমের তথ্য প্রদান করুন।");
    return;
  }

  if (editIdVal) {
    rows = rows.map(r => r.id == editIdVal ? {
      ...r,
      subject: addSubject.value,
      teacher: addTeacher.value,
      room: addRoom.value,
      period: parseInt(addPeriod.value),
      day: addDay.value,
      className: addClass.value,
      tag: addTag.value
    } : r);
    alert("সফলভাবে আপডেট করা হয়েছে!");
  } else {
    const newItem = {
      id: Date.now(),
      day: addDay.value,
      className: addClass.value,
      period: parseInt(addPeriod.value),
      subject: addSubject.value,
      teacher: addTeacher.value,
      room: addRoom.value,
      tag: addTag.value
    };
    rows.push(newItem);
    alert("নতুন ক্লাস সফলভাবে যুক্ত করা হয়েছে!");
  }

  localStorage.setItem("sylhet_alia_full_v4", JSON.stringify(rows));
  resetForm();
  setRole(currentRole);
}

function editRoutine(id) {
  const item = rows.find(r => r.id === id);
  if (!item) return;

  editId.value = item.id;
  addSubject.value = item.subject;
  addTeacher.value = item.teacher;
  addRoom.value = item.room;
  addPeriod.value = item.period;
  addDay.value = item.day;
  addClass.value = item.className;
  addTag.value = item.tag || "";

  formTitle.innerText = "ক্লাসের তথ্য সংশোধন করুন";
  saveBtn.innerText = "আপডেট করুন";
  
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function resetForm() {
  editId.value = "";
  addSubject.value = "";
  addTeacher.value = "";
  addRoom.value = "";
  addTag.value = "";
  formTitle.innerText = "ক্লাস সংশোধন / যুক্ত করুন";
  saveBtn.innerText = "রুটিন সংরক্ষণ করুন";
}

function deleteRoutine(id) {
  if (confirm("আপনি কি নিশ্চিতভাবে এই ক্লাসটি মুছে ফেলতে চান?")) {
    rows = rows.filter(r => r.id !== id);
    localStorage.setItem("sylhet_alia_full_v4", JSON.stringify(rows));
    renderCards();
  }
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch((error) => {
      console.warn('Service worker registration failed:', error);
    });
  });
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  deferredPrompt = event;
  console.log('PWA install prompt available');
});

window.addEventListener('appinstalled', () => {
  console.log('PWA installed successfully');
});

init();
</script>
</body>
</html>
